name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims requires-python >=3.11, so 3.11 is tested here. The
        # guard leans on audit-event names, and those have shifted between
        # versions before, so an untested floor is an unverified claim rather
        # than a safe one. 3.14 is what the library is developed against.
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show the interpreter
        run: python -VV

      # Stdlib only, so there is nothing to install. The suite itself puts the
      # repository on PYTHONPATH; no editable install, no lockfile.
      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v

      - name: The proof still runs from a clean checkout
        run: |
          case=seam/proof/checkout/cases/declined.json
          SEAM_SIM=1 \
          SEAM_NAMESPACE=sim-checkout-declined \
          SEAM_CASE=$case \
          SEAM_ARTIFACT="$RUNNER_TEMP/declined.json" \
          python -m seam.proof.checkout
          test -s "$RUNNER_TEMP/declined.json"
          # The expected digest is read from the suite rather than repeated
          # here, so there is exactly one place to change when the format moves.
          PYTHONPATH=. python - "$RUNNER_TEMP/declined.json" <<'PY'
          import json, sys
          from tests.support import RUN_DIGEST
          art = json.load(open(sys.argv[1]))
          assert art["status"] == "passed", art
          assert art["digest"] == RUN_DIGEST, (art["digest"], RUN_DIGEST)
          print("proof ok:", art["digest"])
          PY

      - name: The package builds and imports
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m pip install --force-reinstall "$RUNNER_TEMP"/dist/*.whl
          # These run from a neutral directory on purpose. From the repository
          # root the checkout shadows site-packages, so `import seam` resolves to
          # the working tree and the step passes without ever exercising the
          # wheel it just built. `cd "$RUNNER_TEMP"` makes it test the artifact.
          cd "$RUNNER_TEMP"
          python -c "import seam; print('installed seam', seam.__version__, seam.__file__)"
          python -c "import seam.proof.checkout as p; print('proof packaged', p.__name__)"
          python -c "import pathlib, seam; d=pathlib.Path(seam.__file__).parent; print(sorted(p.name for p in (d/'proof'/'checkout'/'cases').iterdir()))"
          # And prove it really is the installed copy, not the checkout.
          python - <<'PY'
          import pathlib
          import seam
          resolved = pathlib.Path(seam.__file__).resolve()
          if "site-packages" not in resolved.parts:
              raise SystemExit(f"seam resolved to the working tree: {resolved}")
          print("seam resolved to:", resolved)
          PY

  guard:
    name: guard closes on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The suite asserts these codes, but a passing suite on a platform where
      # an audit event does not fire would be a false green. This asserts the
      # events seam depends on actually exist here.
      - name: The audit events the guard relies on are present
        run: |
          python - <<'PY'
          seen = set()
          import sys
          def hook(event, args):
              seen.add(event)
          sys.addaudithook(hook)
          import ctypes, os, socket, subprocess, tempfile
          d = tempfile.mkdtemp()
          p = os.path.join(d, "f")
          open(p, "w").close()
          open(p, encoding="ascii").read()
          fd = os.open(p, os.O_RDONLY); os.close(fd)
          os.listdir(d)
          # os.scandir raises its audit event when the iterator is consumed,
          # not when it is created, so it has to be walked here.
          [entry.name for entry in os.scandir(d)]
          try:
              ctypes.CDLL(None)
          except Exception:
              pass
          try:
              subprocess.run(["/bin/echo", "x"], capture_output=True)
          except Exception:
              pass
          # The process-creating events seam blocks. Asserted because a suite
          # that passes on a platform where an event never fires is a false
          # green: `_FORK_EVENTS` would list a name CPython does not raise and
          # nothing would notice. `os.exec` is deliberately not here -- see the
          # comment on `_FORK_EVENTS` -- and `os.posix_spawnp` is not here
          # because it raises `os.posix_spawn`.
          try:
              if hasattr(os, "fork"):
                  pid = os.fork()
                  if pid == 0:
                      os._exit(0)
                  os.waitpid(pid, 0)
          except Exception:
              pass
          try:
              os.posix_spawn(sys.executable, [sys.executable, "-c", "pass"], {})
          except Exception:
              pass
          try:
              os.system("true")
          except Exception:
              pass
          required = ["open", "os.listdir", "os.scandir", "ctypes.dlopen", "subprocess.Popen"]
          required += ["os.fork", "os.posix_spawn", "os.system"]
          missing = [event for event in required if event not in seen]
          print("observed:", sorted(seen & set(required)))
          if missing:
              raise SystemExit("platform is missing audit events seam needs: " + ", ".join(missing))
          print("all required audit events fire on this platform")
          PY